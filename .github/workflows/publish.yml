name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches version
        if: github.event_name == 'release'
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: |
          id="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$id" version >/dev/null 2>&1; then echo "$id is already on npm"; else npm publish --provenance --access public; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$id" version >/dev/null 2>&1; then echo "$id is already on GitHub Packages"; else npm publish --registry https://npm.pkg.github.com --ignore-scripts; fi
